name: CI and deploy frontend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (leave empty to build the current branch)
        required: false
        type: string

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck and build
    if: ${{github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_API_URL: ${{ vars.NEXT_PUBLIC_BASE_API_URL }}

  build:
    name: Build and push image
    needs: quality
    if: >-
      ${{
        github.event_name != 'pull_request'
        && inputs.tag == ''
        && needs.quality.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate production build variables
        shell: bash
        env:
          NEXT_PUBLIC_BASE_API_URL: ${{ vars.NEXT_PUBLIC_BASE_API_URL }}
        run: |
          if [[ -z "$NEXT_PUBLIC_BASE_API_URL" ]]; then
            echo "::error::Set the NEXT_PUBLIC_BASE_API_URL repository variable"
            exit 1
          fi

      - id: vars
        name: Set image coordinates
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BASE_API_URL=${{ vars.NEXT_PUBLIC_BASE_API_URL }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [quality, build]
    if: >-
      ${{
        always()
        && github.event_name != 'pull_request'
        && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
        && (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ inputs.tag || needs.build.outputs.tag }}
        run: |
          printf -v REMOTE_COMMAND 'cd %q && ./deploy.sh %q' "$DEPLOY_PATH" "$TAG"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"
