name: Cleanup old images

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    name: Keep the latest 15 image versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: package
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.package.outputs.name }}
          package-type: container
          min-versions-to-keep: 15
